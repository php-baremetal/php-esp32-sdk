name: Feature or extension request
description: Suggest a capability of the SDK, or ask for a PHP extension to be made available.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [registry](https://repository.php-baremetal.com) first: the extension or the feature may
        already be a package. Hardware features (GPIO, I2C, Wi-Fi, …) are extension and HAL packages in
        their own repositories; this one covers boards, runtimes, storages, networks, build options and
        the PHP extensions of the SDK.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is this?
      options:
        - A PHP extension to make available (from the PHP source tree)
        - A runtime, storage, network or build option
        - An improvement to something that exists
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: For a PHP extension, name it (e.g. `bcmath`). For a capability, describe it.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: What would you use it for?
      description: The concrete problem it solves — this helps rank it.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the registry for an existing package.
          required: true
