name: Bug report
description: Something built or ran wrong on the board.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the board and versions — a bug on this project almost
        always depends on them. If it reproduces on the latest SDK release, even better.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board
      description: The value of `extra.baremetal.board` in your composer.json, and the board's product name if it is a board of your own.
      placeholder: "espressif-esp32-s3-devkitc-1-n16r8"
    validations:
      required: true
  - type: input
    id: board-package
    attributes:
      label: Board package and version
      description: For a board that comes from a board package (Composer type `bm-boards`), the package and its version from composer.lock. Leave empty for a board of the SDK.
      placeholder: "php-baremetal/boards-waveshare 1.0.0"
  - type: input
    id: versions
    attributes:
      label: SDK and PHP version
      description: The SDK version from `phpbm.lock` and `config.platform.php` from composer.json.
      placeholder: "esp32 2.0.0, PHP 8.5.13"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - init-loop
        - event-driven
        - web-server
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage
      options:
        - embedded
        - microsd
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Your composer.json (packages and `extra.baremetal`) and the smallest `index.php` that shows it.
    validations:
      required: true
  - type: textarea
    id: serial
    attributes:
      label: Serial output
      description: The relevant serial log (boot + the failure), or the phpbm output for a build error. RENDERED AS CODE.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      description: phpbm version (`phpbm --version`), ESP-IDF version, and host OS.
      placeholder: "phpbm 0.4.1, ESP-IDF v6.1.1, Ubuntu 24.04"
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I redacted secrets from the log (WiFi passwords, `.env` values, tokens) — see the [security policy](https://github.com/php-baremetal/php-esp32-sdk/blob/master/SECURITY.md).
          required: true
        - label: It still reproduces on the latest SDK release (or I said which version I'm on).
